<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-card">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Play against the AI with Attitude</p>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box">
        <span class="label">You</span>
        <span id="userScore" class="score">0</span>
      </div>
      <div class="vs">VS</div>
      <div class="score-box">
        <span class="label">AI</span>
        <span id="aiScore" class="score">0</span>
      </div>
    </div>

    <!-- Battle Display -->
    <div class="battlefield">
      <div id="userChoiceDisplay" class="choice-display">❔</div>
      <div id="aiChoiceDisplay" class="choice-display">❔</div>
    </div>

    <!-- AI Reaction / Commentary -->
    <div class="ai-box">
      <div class="ai-avatar">🤖</div>
      <p id="aiComment">"Chalo shuru karo, dekhta hoon kaisa khelte ho!"</p>
    </div>

    <!-- User Action Buttons -->
    <div class="choices">
      <button class="choice-btn" data-choice="rock">🪨 Rock</button>
      <button class="choice-btn" data-choice="paper">📄 Paper</button>
      <button class="choice-btn" data-choice="scissors">✂️ Scissors</button>
    </div>

    <!-- Reset Button -->
    <button id="resetBtn" class="reset-btn">🔄 Reset Game</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
